name: Validate workshop module

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        # svg_raster 的预览渲染依赖 Pillow；之前没装，导致
        # SvgRasterPaintTests 全部 ModuleNotFoundError: No module named 'PIL'
        run: python -m pip install --upgrade pip pillow

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build self-contained UI and run contract tests
        run: pnpm test

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -v

      - name: Verify backend contains only text sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed = {".py", ".toml", ".json", ".txt", ".md", ".cfg", ".ini", ".csv"}
          for p in Path("backend").rglob("*"):
              if p.is_file():
                  assert p.suffix in allowed, f"binary or disallowed file: {p}"
                  assert not p.name.startswith("."), f"hidden file: {p}"
          print("backend text-only check passed")
          PY

      - name: Verify generated UI did not change reviewed source
        run: git diff --exit-code
